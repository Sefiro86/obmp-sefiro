<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Transformation</title>
  <style>
    /* Bestiary: dark leather, bone, burnished gold for the selection, dried blood for the current form. Windows system
       fonts (the game's CEF, no web fonts): Constantia for names, Candara for the rest. */
    :root {
      --leather: rgba(36, 27, 23, 0.95);
      --leather-deep: rgba(24, 18, 15, 0.97);
      --bone: #e3d6bd;
      --bone-dim: #9c8f7b;
      --seam: #4a3a2f;
      --gold: #c49a52;
      --gold-wash: rgba(196, 154, 82, 0.14);
      --blood: #b0423a;
      --display: Constantia, "Palatino Linotype", Georgia, serif;
      --text: Candara, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; }
    body { color: var(--bone); font: 14px/1.4 var(--text); display: flex; }
    .book {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
      background: var(--leather);
      border: 1px solid var(--seam);
      border-radius: 3px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.65), inset 0 0 0 4px var(--leather-deep), inset 0 0 0 5px var(--seam);
    }
    header { padding: 18px 22px 12px; }
    h1 { margin: 0; font: 400 26px/1 var(--display); letter-spacing: 0.01em; }
    .now { margin-top: 6px; font-size: 13px; color: var(--bone-dim); }
    .now b { color: var(--blood); font-weight: 600; }
    .now.plain b { color: var(--bone); font-weight: 400; }

    .pages { flex: 1; overflow-y: auto; padding: 0 10px 8px; scrollbar-width: thin; scrollbar-color: var(--seam) transparent; }
    h2 {
      margin: 14px 12px 4px; padding-bottom: 4px;
      font: italic 400 15px/1 var(--display); color: var(--gold);
      border-bottom: 1px solid var(--seam);
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      position: relative; display: flex; align-items: center; gap: 10px;
      padding: 6px 12px 6px 16px; border-radius: 2px; cursor: pointer;
    }
    li .name { flex: 1; font: 400 17px/1.25 var(--display); }
    li .using { font-size: 12px; color: var(--blood); }
    li.sel { background: var(--gold-wash); }
    li.sel::before {
      content: ""; position: absolute; left: 4px; top: 7px; bottom: 7px; width: 3px; border-radius: 2px;
      background: var(--gold);
    }
    li.sel .name { color: #f1e6cf; }

    /* skins: diamond-shaped gems; the selected one gets a gold outline */
    .skins { display: flex; gap: 7px; align-items: center; }
    .gem {
      position: relative; width: 13px; height: 13px; transform: rotate(45deg);
      border: 1px solid rgba(0, 0, 0, 0.55); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .gem.pick { outline: 1.5px solid var(--gold); outline-offset: 2px; }
    .skinname { display: none; padding: 0 12px 6px 16px; margin-top: -2px; font-size: 13px; color: var(--bone-dim); }
    .skinname b { color: var(--bone); font-weight: 400; }
    li.sel + .skinname { display: block; }

    .back { margin: 8px 10px 0; padding-top: 6px; border-top: 1px solid var(--seam); }
    .back li .name { font-size: 16px; color: var(--bone-dim); }
    .back li.sel .name { color: var(--bone); }

    footer {
      display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 22px 14px;
      font-size: 12px; color: var(--bone-dim); border-top: 1px solid var(--seam); background: var(--leather-deep);
    }
    kbd {
      display: inline-block; min-width: 18px; padding: 1px 5px; margin-right: 4px; text-align: center;
      font: 11px/1.4 var(--text); color: var(--bone);
      border: 1px solid var(--seam); border-bottom-width: 2px; border-radius: 3px; background: rgba(255, 255, 255, 0.04);
    }
    footer .hide { display: none; }
    footer.has-skins .hide { display: inline; }
  </style>
</head>
<body>
  <div class="book">
    <header>
      <h1>Transformation</h1>
      <div class="now" id="now"></div>
    </header>
    <div class="pages" id="pages"></div>
    <footer id="keys">
      <span><kbd>↑</kbd><kbd>↓</kbd>select</span>
      <span class="hide"><kbd>←</kbd><kbd>→</kbd>skin</span>
      <span><kbd>Enter</kbd>transform</span>
      <span><kbd>Esc</kbd>close</span>
    </footer>
  </div>
  <script>
    // Fake readym for previewing outside the game (in game, CEF provides it).
    if (!window.readym) {
      let cb = null;
      window.readym = {
        onTransformMenuState(f) { cb = f; },
        sendTransformMenuReady() {
          const cur = new URLSearchParams(location.search).get("current") ?? "pack:succubus:violet";
          const sample = "troll|beasts|Troll;wolf|beasts|Wolf;bear|beasts|Bear;skeleton|undead|Skeleton;xivilai|daedra|Xivilai;baliwog|shivering|Baliwog;pack:succubus|characters|Succubus|Original|linear-gradient(135deg, #e2c1b5 50%, #8e1f24 50%);pack:succubus:violet|characters|Succubus|Violet|#8577b9;pack:succubus:crimson|characters|Succubus|Crimson|#a5202b;pack:succubus:obsidian|characters|Succubus|Obsidian|linear-gradient(135deg, #47444c, #1c1b1f);pack:succubus:pearl|characters|Succubus|Pearl|linear-gradient(135deg, #a9dccd 50%, #d9cfd6 50%);@beasts|Beasts of Tamriel;@undead|Undead;@daedra|Daedra;@shivering|Shivering Isles;@characters|Characters";
          setTimeout(() => cb && cb(sample, cur), 0);
        },
        sendTransformMenuPick(n) { console.log("pick", n); },
        sendTransformMenuClose() { console.log("close"); }
      };
    }

    // List from the mod (Creatures.MenuList): "id|group|name|skin|color" entries separated by ';' and "@group|title" for
    // the groups, already in bestiary order. The skins of a pack ("pack:<id>:<skin>") become gems of one entry.
    const SKINS = {};   // form -> { label, color } of its skin (from character packs)

    let entries = [];   // { base, variants: [internal names...], label }
    let current = "";   // current form ("" = normal)
    let sel = 0;        // index in entries (the last one is "Back to normal")
    let skinPick = {};  // base -> index of the selected variant

    // "pack:<id>:<skin>" -> "pack:<id>": the skins of a pack are gems of the same entry
    const baseOf = (n) => n.startsWith("pack:") ? n.split(":").slice(0, 2).join(":") : n;
    const names = {};   // id -> displayed name
    const label = (n) => names[n] || n;
    const isCurrent = (e) => e.base === "off" ? current === "" : e.variants.includes(current);

    function build(list) {
      const titles = new Map(), byBase = new Map(), order = [];
      for (const tok of list.split(";").filter(Boolean)) {
        const [id, group, name, skinName, skinColor] = tok.split("|");
        if (id.startsWith("@")) { titles.set(id.slice(1), group); continue; }
        names[id] = name;
        if (skinName) SKINS[id] = { label: skinName, color: skinColor || "#777" };
        const b = baseOf(id);
        if (!byBase.has(b)) { byBase.set(b, { base: b, group, variants: [], label: name || b }); order.push(b); }
        byBase.get(b).variants.push(id);
      }
      const groups = [];
      for (const b of order) {
        const e = byBase.get(b);
        let g = groups.find(x => x.id === e.group);
        if (!g) { g = { id: e.group, title: titles.get(e.group) || e.group, items: [] }; groups.push(g); }
        g.items.push(e);
      }
      entries = groups.flatMap(g => g.items);
      entries.push({ base: "off", variants: ["off"], label: "Back to normal" });
      for (const e of entries) {
        const at = e.variants.indexOf(current);
        skinPick[e.base] = at >= 0 ? at : 0;
      }
      return groups.filter(g => g.items.length);
    }

    let groups = [];
    function render() {
      const now = document.getElementById("now");
      now.classList.toggle("plain", current === "");
      now.innerHTML = current === "" ? "Your own form: <b></b>" : "Current form: <b></b>";
      now.querySelector("b").textContent = current === "" ? "pick one from the bestiary"
        : label(baseOf(current)) + (SKINS[current] && current !== baseOf(current) ? " " + SKINS[current].label : "");

      const pages = document.getElementById("pages");
      pages.innerHTML = "";
      let i = 0;
      const row = (e, idx) => {
        const li = document.createElement("li");
        if (idx === sel) li.classList.add("sel");
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = e.label;
        li.append(name);
        if (isCurrent(e) && e.base !== "off") {
          const u = document.createElement("span");
          u.className = "using";
          u.textContent = "current";
          li.append(u);
        }
        if (e.variants.length > 1) {
          const box = document.createElement("span");
          box.className = "skins";
          e.variants.forEach((v, k) => {
            const g = document.createElement("span");
            g.className = "gem";
            g.style.background = (SKINS[v] || {}).color || "#777";
            if (k === skinPick[e.base] && idx === sel) g.classList.add("pick");
            if (v === current) g.classList.add("used");
            g.title = (SKINS[v] || {}).label || v;
            g.addEventListener("click", (ev) => { ev.stopPropagation(); sel = idx; skinPick[e.base] = k; pick(); });
            box.append(g);
          });
          li.append(box);
        }
        li.addEventListener("mouseenter", () => { if (sel !== idx) { sel = idx; render(); } });
        li.addEventListener("click", () => { sel = idx; pick(); });
        return li;
      };
      for (const g of groups) {
        const h = document.createElement("h2");
        h.textContent = g.title;
        const ul = document.createElement("ul");
        for (const e of g.items) {
          const idx = i++;
          ul.append(row(e, idx));
          if (e.variants.length > 1) {
            const s = document.createElement("div");
            s.className = "skinname";
            const v = e.variants[skinPick[e.base]];
            s.innerHTML = "Skin: <b></b>";
            s.querySelector("b").textContent = (SKINS[v] || {}).label || v;
            ul.append(s);
          }
        }
        pages.append(h, ul);
      }
      const back = document.createElement("ul");
      back.className = "back";
      back.append(row(entries[entries.length - 1], i));
      pages.append(back);

      document.getElementById("keys").classList.toggle("has-skins", entries[sel] && entries[sel].variants.length > 1);
      const s = pages.querySelector("li.sel");
      if (s) s.scrollIntoView({ block: "nearest" });
    }

    function pick() {
      const e = entries[sel];
      if (e) readym.sendTransformMenuPick(e.variants[skinPick[e.base]] || e.variants[0]);
    }

    function cycleSkin(d) {
      const e = entries[sel];
      if (!e || e.variants.length < 2) return;
      skinPick[e.base] = (skinPick[e.base] + d + e.variants.length) % e.variants.length;
      render();
    }

    document.addEventListener("keydown", (ev) => {
      if (!entries.length) return;
      const k = ev.key;
      if (k === "ArrowDown" || k === "s" || k === "S") { sel = (sel + 1) % entries.length; render(); }
      else if (k === "ArrowUp" || k === "w" || k === "W") { sel = (sel - 1 + entries.length) % entries.length; render(); }
      else if (k === "ArrowRight" || k === "d" || k === "D") cycleSkin(1);
      else if (k === "ArrowLeft" || k === "a" || k === "A") cycleSkin(-1);
      else if (k === "Enter" || k === " ") pick();
      else if (k === "Escape") readym.sendTransformMenuClose();
      else return;
      ev.preventDefault();
    });

    readym.onTransformMenuState((creatures, cur) => {
      current = cur || "";
      groups = build(creatures);
      const at = entries.findIndex(isCurrent);   // in normal form start from the first creature, not from "Back to normal"
      sel = current !== "" && at >= 0 ? at : 0;
      render();
    });

    readym.sendTransformMenuReady();
  </script>
</body>
</html>
